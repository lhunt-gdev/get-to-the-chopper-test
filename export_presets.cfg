html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-fullscreen\">
<script>
// iPhone audio. Safari only lets a page start audio from inside a tap, and mutes web audio on
// silent unless the page asks for \"playback\". So: ask for playback; keep hold of every audio
// context the game makes; and on each tap (until they're running) resume them and play a
// one-sample sound through them, the classic iOS unlock, plus a silent looping clip for
// older iOS.
(function () {
  var contexts = [];
  var Real = window.AudioContext || window.webkitAudioContext;
  if (Real) {
    var Tracked = function (options) {
      var ctx = options === undefined ? new Real() : new Real(options);
      contexts.push(ctx);
      return ctx;
    };
    Tracked.prototype = Real.prototype;
    window.AudioContext = Tracked;
    if (window.webkitAudioContext) { window.webkitAudioContext = Tracked; }
  }
  function session() { try { if (navigator.audioSession) { navigator.audioSession.type = \"playback\"; } } catch (e) {} }
  session();
  var clip = null;
  function unlock() {
    session();
    if (!clip) {
      try {
        clip = document.createElement(\"audio\");
        clip.setAttribute(\"playsinline\", \"\");
        clip.loop = true;
        clip.src = \"data:audio/wav;base64,\";
        var p = clip.play();
        if (p && p.catch) { p.catch(function () {}); }
      } catch (e) {}
    }
    var waiting = false;
    contexts.forEach(function (ctx) {
      try {
        if (ctx.state !== \"running\") {
          waiting = true;
          ctx.resume();
          var src = ctx.createBufferSource();
          src.buffer = ctx.createBuffer(1, 1, 22050);
          src.connect(ctx.destination);
          src.start(0);
        }
      } catch (e) {}
    });
    if (!waiting && contexts.length > 0) {
      [\"touchstart\", \"touchend\", \"click\", \"keydown\"].forEach(function (t) { document.removeEventListener(t, unlock, true); });
    }
  }
  [\"touchstart\", \"touchend\", \"click\", \"keydown\"].forEach(function (t) { document.addEventListener(t, unlock, true); });
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
