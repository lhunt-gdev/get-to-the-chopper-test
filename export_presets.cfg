html/head_include="<meta name=\"description\" content=\"HOT EXFIL: a PS1-style action runner for your phone. Fight your way out and reach the chopper before it lifts off.\">
<meta name=\"application-name\" content=\"HOT EXFIL\">
<meta name=\"apple-mobile-web-app-title\" content=\"HOT EXFIL\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"theme-color\" content=\"#000000\">
<style>
/* Loading: the title image on black, never the page's grey. */
html, body, #status { background-color: #000; }
/* Held sideways on a phone: a black screen asking for it upright, over the game; it takes the
   touches, so none reach the game. Touch screens with no mouse only, so never a desktop. */
#turn-upright { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 100; background-color: #000; align-items: center; justify-content: center; touch-action: none; }
#turn-upright img { width: 356px; max-width: 80vw; image-rendering: pixelated; }
@media (orientation: landscape) and (hover: none) and (pointer: coarse) { #turn-upright { display: flex; } }
</style>
<script>
// iPhone audio. Safari only lets a page start audio from inside a tap, and mutes web audio on
// silent unless the page asks for \"playback\". So: ask for playback; keep hold of every audio
// context the game makes; and on every tap resume any that isn't running and play a one-sample
// sound through it, the classic iOS unlock, plus a silent looping clip for older iOS. iOS
// suspends or interrupts them again after a switch to another app or a call, so the taps keep
// listening for good (a state check when all is running), and coming back to the page
// (visibilitychange, pageshow) resumes them too.
(function () {
  var contexts = [];
  var Real = window.AudioContext || window.webkitAudioContext;
  if (Real) {
    var Tracked = function (options) {
      var ctx = options === undefined ? new Real() : new Real(options);
      contexts.push(ctx);
      return ctx;
    };
    Tracked.prototype = Real.prototype;
    window.AudioContext = Tracked;
    if (window.webkitAudioContext) { window.webkitAudioContext = Tracked; }
  }
  function session() { try { if (navigator.audioSession) { navigator.audioSession.type = \"playback\"; } } catch (e) {} }
  session();
  var clip = null;
  function resume(ctx) {
    try {
      var p = ctx.resume();
      if (p && p.catch) { p.catch(function () {}); }
    } catch (e) {}
  }
  function unlock() {
    session();
    if (clip && clip.paused) {
      try {
        var again = clip.play();
        if (again && again.catch) { again.catch(function () {}); }
      } catch (e) {}
    }
    if (!clip) {
      try {
        clip = document.createElement(\"audio\");
        clip.setAttribute(\"playsinline\", \"\");
        clip.loop = true;
        clip.src = \"data:audio/wav;base64,\";
        var p = clip.play();
        if (p && p.catch) { p.catch(function () {}); }
      } catch (e) {}
    }
    contexts.forEach(function (ctx) {
      try {
        if (ctx.state !== \"running\" && ctx.state !== \"closed\") {
          resume(ctx);
          var src = ctx.createBufferSource();
          src.buffer = ctx.createBuffer(1, 1, 22050);
          src.connect(ctx.destination);
          src.start(0);
        }
      } catch (e) {}
    });
  }
  // Back on the page (from another app, the app switcher or the lock screen): resume what iOS
  // stopped. Without a tap Safari may refuse; the next tap then does it.
  function back() {
    if (document.visibilityState && document.visibilityState !== \"visible\") { return; }
    session();
    contexts.forEach(function (ctx) {
      if (ctx.state !== \"running\" && ctx.state !== \"closed\") { resume(ctx); }
    });
  }
  [\"touchstart\", \"touchend\", \"click\", \"keydown\"].forEach(function (t) { document.addEventListener(t, unlock, true); });
  document.addEventListener(\"visibilitychange\", back);
  window.addEventListener(\"pageshow\", back);
})();
</script>
<script>
// Held sideways on a phone: the TURN YOUR PHONE UPRIGHT screen (the style above shows it, in the
// game's pixel font) takes every touch, and the game is told it lost focus, so a run pauses and a
// held FIRE lets go; upright again, it gets its focus back.
(function () {
  var sideways = window.matchMedia ? window.matchMedia(\"(orientation: landscape) and (hover: none) and (pointer: coarse)\") : null;
  function setup() {
    var cover = document.createElement(\"div\");
    cover.id = \"turn-upright\";
    var words = document.createElement(\"img\");
    words.alt = \"TURN YOUR PHONE UPRIGHT\";
    words.src = \"data:image/png;base64,\";
    cover.appendChild(words);
    [\"touchstart\", \"touchmove\", \"touchend\", \"mousedown\", \"click\"].forEach(function (t) {
      cover.addEventListener(t, function (e) { if (e.cancelable) { e.preventDefault(); } e.stopPropagation(); }, { passive: false });
    });
    document.body.appendChild(cover);
    if (!sideways) { return; }
    var was = false;
    function turned() {
      var now = sideways.matches;
      if (now === was) { return; }
      was = now;
      var canvas = document.getElementById(\"canvas\");
      if (!canvas) { return; }
      if (now) {
        window.dispatchEvent(new Event(\"blur\"));
        canvas.dispatchEvent(new Event(\"blur\"));
      } else {
        canvas.dispatchEvent(new Event(\"focus\"));
      }
    }
    if (sideways.addEventListener) { sideways.addEventListener(\"change\", turned); } else if (sideways.addListener) { sideways.addListener(turned); }
    turned();
  }
  if (document.body) { setup(); } else { document.addEventListener(\"DOMContentLoaded\", setup); }
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
