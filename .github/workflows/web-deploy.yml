# Every push to main (the demo) or v2 (the next version): run the tests for what was pushed, then
# export BOTH versions and publish them together on GitHub Pages: the demo at the site's root (the
# link players have), V2 under /v2/ for testing. Open the Pages URL on your iPhone in Safari.
name: Test & deploy web build

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -jq templates.tpz 'templates/web*' 'templates/version.txt' -d "$dest"
          rm templates.tpz

      - name: Tests (unit + bot playthroughs) for what was pushed
        run: GODOT=~/godot/godot bash tests/run_all.sh

      - name: Check out the demo (main) and V2 (v2)
        if: github.event_name != 'pull_request'
        run: |
          git clone --quiet --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" demo_src
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" v2 >/dev/null; then
            git clone --quiet --depth 1 --branch v2 "https://github.com/${GITHUB_REPOSITORY}.git" v2_src
          fi

      - name: Export the demo to the site's root and V2 to /v2/
        if: github.event_name != 'pull_request'
        run: |
          stamp="$(date -u '+%d %b %H:%M')"
          export_one() {  # $1 source folder, $2 output folder
            sha="$(git -C "$1" rev-parse --short=7 HEAD)"
            printf '{"commit": "%s", "built": "%s"}\n' "$sha" "$stamp" > "$1/game/build_info.json"
            cat "$1/game/build_info.json"
            mkdir -p "$2"
            ~/godot/godot --headless --path "$1" --import >/dev/null 2>&1 || true
            ~/godot/godot --headless --path "$1" --export-release "Web" "$(pwd)/$2/index.html"
            test -f "$2/index.wasm"
          }
          export_one demo_src build/web
          if [ -d v2_src ]; then export_one v2_src build/web/v2; fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
