<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Future's jacket emblem: a tech insignia drawn for the game. A hexagon round a cyber skull,
       circuit traces running out to either side and down to nodes. His jacket's own violet, its core
       a lighter violet like lit trim. -->
  <g fill="none" stroke="#7d3da3" stroke-linecap="square" stroke-linejoin="miter">
    <!-- the circuit traces: out from the hexagon's sides, stepping down, to nodes -->
    <path d="M68,96 L52,96 L36,112 L14,112" stroke-width="7"/>
    <path d="M172,96 L188,96 L204,112 L226,112" stroke-width="7"/>
    <path d="M68,144 L58,144 L44,158 L44,184" stroke-width="7"/>
    <path d="M172,144 L182,144 L196,158 L196,184" stroke-width="7"/>
    <path d="M120,182 L120,214" stroke-width="7"/>
    <path d="M100,176 L86,190 L86,222" stroke-width="5"/>
    <path d="M140,176 L154,190 L154,222" stroke-width="5"/>
    <path d="M120,58 L120,30" stroke-width="7"/>
    <!-- the hexagon -->
    <path d="M120,58 L172,88 L172,150 L120,180 L68,150 L68,88 Z" stroke-width="10"/>
  </g>
  <!-- the nodes at the traces' ends -->
  <g fill="#7d3da3">
    <rect x="2" y="105" width="15" height="15"/>
    <rect x="223" y="105" width="15" height="15"/>
    <rect x="37" y="182" width="15" height="15"/>
    <rect x="189" y="182" width="15" height="15"/>
    <rect x="113" y="212" width="15" height="15"/>
    <rect x="80" y="220" width="12" height="12"/>
    <rect x="148" y="220" width="12" height="12"/>
    <rect x="113" y="16" width="15" height="15"/>
  </g>
  <!-- a cyber skull in the hexagon: an angular skull in the lighter violet, its eye sockets, nose and
       the gaps between its teeth cut through to the jacket; the right half of its jaw and brow plated,
       with a circuit trace across its forehead in the darker violet -->
  <defs>
    <mask id="skull" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240">
      <rect width="240" height="240" fill="white"/>
      <g fill="black">
        <!-- the eye sockets, slanting down to his nose -->
        <path d="M92,103 L117,111 L115,126 L97,123 Z"/>
        <path d="M148,103 L123,111 L125,126 L143,123 Z"/>
        <!-- the nose -->
        <path d="M120,128 L126,140 L114,140 Z"/>
        <!-- the gaps between the teeth, and the line of the jaw -->
        <path d="M100,148 L140,148 L140,151 L100,151 Z"/>
        <path d="M106,151 h3 v12 h-3 Z M115,151 h3 v13 h-3 Z M124,151 h3 v13 h-3 Z M133,151 h3 v12 h-3 Z"/>
      </g>
    </mask>
  </defs>
  <path mask="url(#skull)" fill="#b682de" d="M120,72 L144,78 L154,96 L152,124 L144,134 L142,146 L138,164 L102,164 L98,146 L96,134 L88,124 L86,96 L96,78 Z"/>
  <!-- the circuit across its forehead to a node, and a seam on its brow -->
  <g fill="none" stroke="#7d3da3" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M120,76 L120,96 L132,96 L140,88" stroke-width="3"/>
    <path d="M100,92 L108,92" stroke-width="3"/>
  </g>
  <rect x="138" y="85" width="6" height="6" fill="#7d3da3"/>
  <!-- its eyes lit -->
  <path d="M99,110 L111,114 L110,121 L101,119 Z M141,110 L129,114 L130,121 L139,119 Z" fill="#e3c8f5"/>
</svg>
