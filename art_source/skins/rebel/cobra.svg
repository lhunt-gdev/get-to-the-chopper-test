<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- Rebel's jacket emblem: a cobra reared up out of its coil, hood spread, fangs out. One gold, no
       outline, printed into the jacket as its old emblem was; its details a deeper gold, and where the
       body crosses itself a gap of the jacket shows. Drawn for this game. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="280">
      <rect width="200" height="280" fill="white"/>
      <!-- the gaps where the body passes in front of the coil -->
      <path d="M148,226 C160,214 160,200 150,190" fill="none" stroke="black" stroke-width="5"/>
      <!-- the head against the hood -->
      <path d="M72,40 C80,62 120,62 128,40" fill="none" stroke="black" stroke-width="4"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <g fill="none" stroke="#c8962e" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="100" cy="244" rx="64" ry="20" stroke-width="18"/>
      <path d="M42,250 C18,258 20,276 46,272" stroke-width="8"/>
      <path d="M154,240 C178,206 146,184 106,176 C62,168 52,150 72,136 C86,126 98,132 100,130" stroke-width="22"/>
    </g>
    <path d="M100,36 C132,30 166,58 164,96 C162,124 130,142 100,148 C70,142 38,124 36,96 C34,58 68,30 100,36 Z" fill="#c8962e"/>
  </g>
  <path d="M100,4 C116,6 128,20 126,36 C124,50 112,60 100,62 C88,60 76,50 74,36 C72,20 84,6 100,4 Z" fill="#c8962e"/>
  <!-- its details, a deeper gold -->
  <g fill="none" stroke="#8a6418" stroke-linecap="round" stroke-linejoin="round">
    <path d="M146,220 L166,214 M130,192 L144,178 M102,184 L106,168 M72,170 L84,156 M60,146 L78,148" stroke-width="3"/>
    <path d="M84,76 L100,88 L116,76 M86,96 L100,108 L114,96 M88,116 L100,128 L112,116" stroke-width="4"/>
    <path d="M52,74 C46,92 52,112 70,126 M148,74 C154,92 148,112 130,126" stroke-width="4"/>
    <path d="M82,26 L95,33 M118,26 L105,33" stroke-width="5"/>
    <path d="M86,48 C94,54 106,54 114,48" stroke-width="4"/>
  </g>
  <path d="M90,50 L93,61 L96,51 Z M110,50 L107,61 L104,51 Z" fill="#efe2c0"/>
  <path d="M100,56 L100,72 M100,72 L95,79 M100,72 L105,79" fill="none" stroke="#a8401c" stroke-width="3" stroke-linecap="round"/>
</svg>
