<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- Rebel's jacket emblem: a cobra reared up out of its coil, hood spread, fangs out, as stitched on
       the back of a jacket. Gold on a dark outline, like the jacket's old emblem. Drawn for this game. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the outline under the body -->
    <ellipse cx="100" cy="244" rx="64" ry="20" stroke="#2e1d06" stroke-width="26"/>
    <path d="M42,250 C18,258 20,276 46,272" stroke="#2e1d06" stroke-width="16"/>
    <path d="M154,240 C178,206 146,184 106,176 C62,168 52,150 72,136 C86,126 98,132 100,130" stroke="#2e1d06" stroke-width="30"/>
    <!-- the coil, the tail and the body rising out of it -->
    <ellipse cx="100" cy="244" rx="64" ry="20" stroke="#c8962e" stroke-width="16"/>
    <path d="M42,250 C18,258 20,276 46,272" stroke="#c8962e" stroke-width="7"/>
    <path d="M154,240 C178,206 146,184 106,176 C62,168 52,150 72,136 C86,126 98,132 100,130" stroke="#c8962e" stroke-width="20"/>
    <!-- belly scales across it -->
    <path d="M146,220 L166,214 M130,192 L144,178 M102,184 L106,168 M72,170 L84,156 M60,146 L78,148" stroke="#7a5414" stroke-width="3"/>
  </g>
  <!-- the hood, spread wide -->
  <path d="M100,36 C132,30 166,58 164,96 C162,124 130,142 100,148 C70,142 38,124 36,96 C34,58 68,30 100,36 Z" fill="#c8962e" stroke="#2e1d06" stroke-width="6" stroke-linejoin="round"/>
  <!-- its scales: chevrons down the middle, and its edges shaded -->
  <g fill="none" stroke="#7a5414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,76 L100,88 L116,76"/>
    <path d="M86,96 L100,108 L114,96"/>
    <path d="M88,116 L100,128 L112,116"/>
    <path d="M52,74 C46,92 52,112 70,126"/>
    <path d="M148,74 C154,92 148,112 130,126"/>
  </g>
  <!-- the head, pointed, its eyes narrowed -->
  <path d="M100,4 C116,6 128,20 126,36 C124,50 112,60 100,62 C88,60 76,50 74,36 C72,20 84,6 100,4 Z" fill="#c8962e" stroke="#2e1d06" stroke-width="5" stroke-linejoin="round"/>
  <path d="M82,26 L95,33 M118,26 L105,33" stroke="#2e1d06" stroke-width="5" stroke-linecap="round"/>
  <path d="M86,28 L93,32 M114,28 L107,32" stroke="#b02a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- the mouth open, the fangs and the forked tongue -->
  <path d="M86,48 C94,54 106,54 114,48" fill="none" stroke="#2e1d06" stroke-width="4" stroke-linecap="round"/>
  <path d="M90,50 L93,62 L95,51 Z M110,50 L107,62 L105,51 Z" fill="#f2ead2" stroke="#2e1d06" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M100,54 L100,74 M100,74 L94,82 M100,74 L106,82" fill="none" stroke="#b02a1a" stroke-width="3.5" stroke-linecap="round"/>
</svg>
